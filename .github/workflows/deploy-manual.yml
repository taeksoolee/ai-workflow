# NOTE: manual/docs 마크다운을 GitHub Pages 로 배포한다.
# 리포에는 빌드 도구를 두지 않는다 — GitHub 의 내장 Jekyll 빌더(actions/jekyll-build-pages)가
# 마크다운을 HTML 로 변환한다. 상대 .md 링크는 jekyll-relative-links(기본 활성)가 .html 로 바꿔준다.
#
# 최초 1회 리포 설정 필요: Settings → Pages → Source 를 "GitHub Actions" 로 변경.
name: Deploy Manual

on:
  push:
    branches: [main]
    paths:
      - 'manual/docs/**'
      - '.github/workflows/deploy-manual.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./manual/docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
